<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HireReady</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h2>HireReady</h2>
            </div>
            <div class="nav_links">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html">Jobs</a></li>
                    <li><a href="company.html">Companies</a></li>
                    <li class="login_button"><a href="auth.html">Login</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2>Login to HireReady</h2>
            <form class="form" action="">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your Email">
                <br>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your Password">
                <br>
                <input type="checkbox" id="rememberme" name="rememberme">
                <label for="rememberme">Remember me</label>
                <br>
                <button class="auth-login">Login</button>
                <p>Don't you have an account? <a href="./auth.html">Sign Up</a></p>
            </form>
        </div>
        
    </main>
    <footer>
        <div class="copyright_msg">
            &copy;2026 HireReady. All rights reserved.
        </div>
        <div class="quick_links">
            <ul>
                <li><a href="#">Privacy</a></li>
                <li><a href="#">Terms</a></li>
                <li><a href="#">Support</a></li>
            </ul>
        </div>
    </footer>
</body>
</html>
